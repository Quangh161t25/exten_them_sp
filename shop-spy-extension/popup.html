<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Shop Spy</title>
  <link rel="stylesheet" href="lib/style.css" />
  <style>
    body { width: 420px; padding: 12px; }
    .bar { display: flex; gap: 6px; }
    .bar .input { flex: 1; }
    h2 { margin: 0 0 8px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    h2 span { color: var(--brand); }
    .section { margin-top: 10px; }
    .top-item { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-top: 1px solid var(--line); text-decoration: none; }
    .top-item:first-child { border-top: 0; }
    .top-item:hover { background: var(--bg); }
    .top-item img { width: 38px; height: 38px; border-radius: 6px; object-fit: cover; flex: none; }
    .top-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-item .num { text-align: right; font-variant-numeric: tabular-nums; }
    .stats { grid-template-columns: repeat(3, 1fr); }
    .stat .value { font-size: 16px; }
    .shop-head { padding: 10px; }
    .shop-head img { width: 48px; height: 48px; }
    .shop-head h1 { font-size: 15px; }
  </style>
</head>
<body>
  <h2><span>●</span> Shop Spy</h2>
  <div class="bar">
    <input id="q" class="input" placeholder="Link shop / link sản phẩm / username / shop ID" />
    <button id="go" class="btn primary">Soi shop</button>
  </div>
  <div id="hint" class="muted section">Mở một trang shop hoặc sản phẩm trên shopee.vn để tự nhận diện.</div>
  <div id="err" class="alert section hidden"></div>
  <div id="loading" class="section muted hidden"><span class="spinner"></span> Đang tải dữ liệu…</div>
  <div id="result" class="hidden">
    <div id="head" class="card section"></div>
    <div id="stats" class="stats section"></div>
    <div class="muted section" id="note"></div>
    <div class="card section" id="top"></div>
    <button id="full" class="btn primary section" style="width:100%">Xem toàn bộ sản phẩm →</button>
  </div>
  <script src="lib/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
