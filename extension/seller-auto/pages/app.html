<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopee Seller Auto</title>
  <link rel="stylesheet" href="../lib/style.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="side__brand"><span class="side__logo">⚡</span> Seller Auto</div>
      <a href="#dashboard" data-nav="dashboard">Tổng quan</a>
      <a href="#push" data-nav="push">Đẩy sản phẩm <span class="dot" data-dot="push"></span></a>

    <main class="main"><div class="main__inner" id="view"></div></main>

  <script src="../lib/store.js"></script>

  <script src="../lib/jobs.js"></script>

  <script src="view-dashboard.js"></script>
  <script src="view-push.js"></script>
  <script src="view-reply.js"></script>
  <script src="view-rate.js"></script>
