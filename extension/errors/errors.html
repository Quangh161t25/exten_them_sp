<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lỗi hôm nay</title>
  <style>
    :root{--line:#e5e7eb;--muted:#64748b}
    *{box-sizing:border-box}
    body{margin:0;font:13px/1.45 Arial,sans-serif;color:#1f2937;background:#f8fafc}
    header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:2}
    h1{font-size:16px;margin:0 12px 0 0;color:#dc2626}
    select,input,button{font:inherit;padding:5px 8px;border:1px solid #d1d5db;border-radius:6px;background:#fff}
    button{cursor:pointer}button.danger{color:#dc2626;border-color:#fca5a5}
    .grow{flex:1}.muted{color:var(--muted)}
    main{padding:12px 16px}
    .stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
    .chip{background:#fff;border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer}
    .chip.on{background:#fee2e2;border-color:#fca5a5;color:#991b1b;font-weight:700}
    table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px}
    th,td{padding:7px 10px;border-bottom:1px solid #f1f5f9;text-align:left;vertical-align:top}
    th{background:#f8fafc;color:#475569;position:sticky;top:52px}
    td.t{white-space:nowrap;color:var(--muted)}td.m{font-weight:600;white-space:nowrap}
    td.msg{color:#b91c1c;word-break:break-word}
    .empty{padding:30px;text-align:center;color:#16a34a;font-weight:600}
  </style>
</head>
<body>
  <header>
    <h1>⚠️ Lỗi</h1>
    <select id="day"><option value="0">Hôm nay</option><option value="1">Hôm qua</option><option value="2">2 ngày trước</option><option value="all">Cả 3 ngày</option></select>
    <input id="q" placeholder="Tìm mã đơn, nội dung…" style="min-width:200px">
    <span class="grow"></span>
    <label class="muted"><input type="checkbox" id="tele"> Gửi Telegram khi có lỗi</label>
    <button id="reload">⟳ Tải lại</button>
    <button id="clear" class="danger">Xoá lỗi đang xem</button>
  </header>
  <main>
    <div class="stats" id="stats"></div>
    <table><thead><tr><th>Giờ</th><th>Module</th><th>Đơn / SP</th><th>Lỗi</th></tr></thead><tbody id="rows"></tbody></table>
  </main>
  <script src="errors.js"></script>
  <script src="../lib/table-tools.js"></script>
</body>
</html>
